{# ABOUTME: Drag a card from the stack onto a slot, click a card and then a slot, or reorder a lineup with its handle. #}
{# ABOUTME: A lineup column keeps each player once. The schedule grid takes pitchers. #}
<style>
    .decision-card.is-picked { outline: 2px solid #111; }
    .lineup-slot.is-over { background: #f3f4f6; }
    .lineup-column .lineup-slot.is-over { outline: 2px solid #111; outline-offset: 1px; }
    .lineup-column .reorder-handle { border: 1px solid #9ca3af; background: #fff; padding: 0 4px; line-height: 1.2; font-size: 12px; cursor: grab; }
    .lineup-column .slot-frame:not(:has(.decision-card)) .reorder-handle { display: none; }
    .lineup-column .slot-well:not(:has(.decision-card))::after { content: "Drop a hitter here"; color: #6b7280; font-size: 12px; align-self: center; padding: 0 4px; }
    .decision-card.starts-spent { cursor: not-allowed; opacity: 0.55; }
    .slot-well { box-sizing: border-box; display: flex; min-height: 52px; }
    .slot-well:not(:has(.decision-card)) { background: #e5e7eb; }
    .slot-frame:not(:has(.decision-card)) .slot-remove { display: none; }
    .slot-well .decision-card { flex: 1 1 auto; width: 100%; padding-right: 1.25rem; }
</style>
<script>
(function () {
    var picked = null;

    function csrfToken() {
        var input = document.querySelector("[name=csrfmiddlewaretoken]");
        return input ? input.value : "";
    }

    function applyDesignation(playerId, designation) {
        document.querySelectorAll('.decision-card[data-kind="p"][data-player="' + playerId + '"]').forEach(function (card) {
            card.dataset.designation = designation;
            card.querySelectorAll("button[data-designation]").forEach(function (button) {
                var on = button.dataset.designation === designation;
                button.classList.toggle("bg-gray-800", on);
                button.classList.toggle("text-white", on);
            });
        });
    }

    function postDesignation(card, designation, previous) {
        if (!card.dataset.designationUrl) {
            applyDesignation(card.dataset.player, previous);
            return;
        }
        var token = csrfToken();
        var body = new URLSearchParams();
        body.set("player", card.dataset.player);
        body.set("designation", designation);
        if (token) body.set("csrfmiddlewaretoken", token);
        fetch(card.dataset.designationUrl, {
            method: "POST",
            headers: {"X-Requested-With": "fetch", "X-CSRFToken": token},
            body: body
        }).then(function (response) {
            if (!response.ok) applyDesignation(card.dataset.player, previous);
        }).catch(function () {
            applyDesignation(card.dataset.player, previous);
        });
    }

    function boardOf(slot) {
        return slot.closest("[data-lineup], [data-rotation], [data-bullpen], [data-starter-grid]");
    }

    function accepts(slot, card) {
        var board = boardOf(slot);
        if (!board || !card) return false;
        if (board.hasAttribute("data-lineup")) return card.dataset.kind === "h";
        return card.dataset.kind === "p";
    }

    function sourceCard(id, kind) {
        return document.querySelector('[data-stack] .decision-card[data-player="' + id + '"][data-kind="' + kind + '"]');
    }

    function positionCodes(card) {
        if (!card || !card.dataset.positions) return null;
        return card.dataset.positions.split(",").filter(function (code) { return code; });
    }

    function emergencyCodes(card) {
        if (!card || !card.dataset.emergency) return [];
        return card.dataset.emergency.split(",").filter(function (code) { return code; });
    }

    function renderPositions(slot, codes, emergency) {
        var box = slot.querySelector("[data-position-buttons]");
        if (!box || !codes.length) return;
        emergency = emergency || [];
        var hidden = box.querySelector(".position-value");
        var current = hidden.value;
        if (codes.indexOf(current) < 0) current = codes.indexOf("DH") >= 0 ? "DH" : codes[0];
        hidden.value = current;
        var main = box.querySelector("[data-position-main]");
        var home = main || box;
        if (main) main.replaceChildren();
        function addButton(code, isEmergency) {
            var button = document.createElement("button");
            button.type = "button";
            button.dataset.position = code;
            button.textContent = code;
            var on = code === current;
            if (isEmergency) {
                button.dataset.emergency = "";
                button.title = "Emergency only";
                button.className = "border border-gray-300 px-1 leading-none" + (on ? " bg-gray-800 text-white" : " text-gray-400");
            } else {
                button.className = "border border-gray-400 px-1 leading-none" + (on ? " bg-gray-800 text-white" : "");
            }
            home.appendChild(button);
        }
        codes.forEach(function (code) {
            if (emergency.indexOf(code) < 0) addButton(code, false);
        });
        var extras = codes.filter(function (code) { return emergency.indexOf(code) >= 0; });
        if (extras.length) {
            var label = document.createElement("span");
            label.className = "text-gray-400 whitespace-nowrap";
            label.textContent = "Emergency only:";
            home.appendChild(label);
            extras.forEach(function (code) { addButton(code, true); });
        }
    }

    function effectivePitcher(slot) {
        var input = slot.querySelector(".player-id");
        if (input && input.value) return input.value;
        return slot.dataset.autoStarter || "";
    }

    function scheduledOnGrid(playerId) {
        var count = 0;
        document.querySelectorAll("[data-starter-grid] .starter-slot").forEach(function (slot) {
            if (effectivePitcher(slot) === String(playerId)) count += 1;
        });
        return count;
    }

    function startsRoom(card) {
        if (!card || card.dataset.startsCap === undefined || card.dataset.startsCap === "") return null;
        var cap = Number(card.dataset.startsCap);
        var made = Number(card.dataset.startsMade || 0);
        var elsewhere = Number(card.dataset.startsElsewhere || 0);
        return cap - made - elsewhere - scheduledOnGrid(card.dataset.player);
    }

    function canTakeStart(card, slot) {
        var board = boardOf(slot);
        if (!board || !board.hasAttribute("data-starter-grid")) return true;
        var room = startsRoom(card);
        if (room === null) return true;
        if (effectivePitcher(slot) === String(card.dataset.player)) return true;
        return room > 0;
    }

    function tracksStarts() {
        return !!document.querySelector("[data-starter-grid]");
    }

    function refreshStartCards() {
        if (!tracksStarts()) return;
        document.querySelectorAll("[data-stack] .decision-card[data-starts-cap]").forEach(function (card) {
            var open = startsRoom(card) > 0;
            card.draggable = open;
            card.classList.toggle("starts-spent", !open);
            if (open) card.removeAttribute("title");
            else card.title = "No starts left to schedule";
        });
    }

    function hookBox(slot) {
        return slot.querySelector("[data-starter-hook]");
    }

    function hookValue(slot) {
        var box = hookBox(slot);
        if (!box) return "";
        var input = box.querySelector(".hook-value");
        return input ? input.value : "";
    }

    function setHook(slot, value) {
        var box = hookBox(slot);
        if (!box) return;
        var wanted = value || "";
        var buttons = box.querySelectorAll("button[data-hook]");
        var matched = false;
        buttons.forEach(function (button) {
            if (button.dataset.hook === wanted) matched = true;
        });
        if (!matched) wanted = "";
        buttons.forEach(function (button) {
            var on = button.dataset.hook === wanted;
            button.classList.toggle("bg-gray-800", on);
            button.classList.toggle("text-white", on);
        });
        var input = box.querySelector(".hook-value");
        if (input) input.value = wanted;
    }

    function addOrderSlot(button) {
        var board = button.closest("[data-lineup]");
        if (!board) return;
        var list = board.querySelector(".space-y-2");
        if (!list) return;
        var slots = list.querySelectorAll(".lineup-slot");
        var last = slots[slots.length - 1];
        if (!last) return;
        var copy = last.cloneNode(true);
        clearSlot(copy);
        var number = copy.querySelector("[data-slot-number]");
        if (number) number.textContent = String(slots.length + 1);
        list.appendChild(copy);
    }

    function showHook(slot) {
        var box = hookBox(slot);
        if (!box) return;
        var input = slot.querySelector(".player-id");
        box.classList.toggle("hidden", !(input && input.value));
    }

    function clearSlot(slot) {
        var body = slot.querySelector(".slot-body");
        if (body) {
            body.replaceChildren();
            if (slot.dataset.auto) body.textContent = slot.dataset.auto;
        }
        var input = slot.querySelector(".player-id");
        if (input) input.value = "";
        var box = slot.querySelector("[data-position-buttons]");
        if (box && box.dataset.all) renderPositions(slot, box.dataset.all.split(","));
        setHook(slot, "");
        showHook(slot);
    }

    function swapChildren(a, b) {
        var hold = document.createElement("div");
        while (a.firstChild) hold.appendChild(a.firstChild);
        while (b.firstChild) a.appendChild(b.firstChild);
        while (hold.firstChild) b.appendChild(hold.firstChild);
    }

    function swapValue(a, b, selector) {
        var left = a.querySelector(selector);
        var right = b.querySelector(selector);
        if (!left || !right) return;
        var value = left.value;
        left.value = right.value;
        right.value = value;
    }

    function swapLineupSlots(a, b) {
        var aBody = a.querySelector(".slot-body");
        var bBody = b.querySelector(".slot-body");
        if (aBody && bBody) swapChildren(aBody, bBody);
        swapValue(a, b, ".player-id");
        var aChoices = a.querySelector("[data-position-main]");
        var bChoices = b.querySelector("[data-position-main]");
        if (aChoices && bChoices) swapChildren(aChoices, bChoices);
        swapValue(a, b, ".position-value");
        a.querySelectorAll(".is-picked").forEach(function (card) { card.classList.remove("is-picked"); });
        b.querySelectorAll(".is-picked").forEach(function (card) { card.classList.remove("is-picked"); });
        picked = null;
    }

    function slotAlreadyHolding(board, playerId, except) {
        var found = null;
        board.querySelectorAll(".lineup-slot").forEach(function (other) {
            if (other === except) return;
            var input = other.querySelector(".player-id");
            if (input && input.value === playerId) found = other;
        });
        return found;
    }

    function place(slot, card) {
        if (!accepts(slot, card) || !canTakeStart(card, slot)) return;
        var board = boardOf(slot);
        if (board && board.classList.contains("lineup-column")) {
            var from = slotAlreadyHolding(board, card.dataset.player, slot);
            if (from) {
                swapLineupSlots(from, slot);
                refreshStartCards();
                return;
            }
        }
        var carried = null;
        var here = slot.querySelector(".player-id");
        if (here && here.value === card.dataset.player) carried = hookValue(slot);
        if (board && (board.hasAttribute("data-lineup") || board.hasAttribute("data-rotation") || board.hasAttribute("data-bullpen"))) {
            board.querySelectorAll(".lineup-slot, .rotation-slot").forEach(function (other) {
                var input = other.querySelector(".player-id");
                if (other !== slot && input && input.value === card.dataset.player) {
                    if (carried === null) carried = hookValue(other);
                    clearSlot(other);
                }
            });
        }
        var body = slot.querySelector(".slot-body");
        var copy = card.cloneNode(true);
        copy.classList.remove("is-picked");
        body.replaceChildren(copy);
        var input = slot.querySelector(".player-id");
        if (input) input.value = card.dataset.player;
        var codes = positionCodes(card);
        if (codes) renderPositions(slot, codes, emergencyCodes(card));
        if (hookBox(slot)) setHook(slot, carried || "");
        showHook(slot);
        refreshStartCards();
    }

    document.addEventListener("click", function (event) {
        var usageButton = event.target.closest("button[data-bullpen-choice]");
        if (usageButton) {
            event.preventDefault();
            var group = usageButton.closest("[data-bullpen-logic]");
            group.querySelectorAll("button[data-bullpen-choice]").forEach(function (button) {
                var on = button === usageButton;
                button.classList.toggle("is-selected", on);
                button.classList.toggle("bg-gray-800", on);
                button.classList.toggle("text-white", on);
            });
            var input = group.querySelector("input[name=bullpen_logic]");
            if (input) input.value = usageButton.dataset.bullpenChoice;
            var note = group.querySelector(".bullpen-logic-note");
            if (note) note.textContent = usageButton.dataset.note || "";
            return;
        }
        var designationButton = event.target.closest("button[data-designation]");
        if (designationButton) {
            event.preventDefault();
            var named = designationButton.closest(".decision-card");
            if (!named) return;
            var designation = designationButton.dataset.designation;
            var previous = named.dataset.designation;
            if (designation === previous) return;
            applyDesignation(named.dataset.player, designation);
            postDesignation(named, designation, previous);
            return;
        }
        var clearLineup = event.target.closest("[data-clear-lineup]");
        if (clearLineup) {
            event.preventDefault();
            clearLineup.closest("[data-lineup]").querySelectorAll(".lineup-slot").forEach(clearSlot);
            return;
        }
        var clearButton = event.target.closest("[data-clear]");
        if (clearButton) {
            event.preventDefault();
            clearSlot(clearButton.closest(".lineup-slot, .rotation-slot"));
            refreshStartCards();
            return;
        }
        var addSlot = event.target.closest("[data-add-slot]");
        if (addSlot) {
            event.preventDefault();
            addOrderSlot(addSlot);
            return;
        }
        var hookButton = event.target.closest("button[data-hook]");
        if (hookButton) {
            event.preventDefault();
            var hookSlot = hookButton.closest(".lineup-slot, .rotation-slot");
            if (hookSlot) setHook(hookSlot, hookButton.dataset.hook);
            return;
        }
        var positionButton = event.target.closest("button[data-position]");
        if (positionButton) {
            event.preventDefault();
            var box = positionButton.closest("[data-position-buttons]");
            box.querySelector(".position-value").value = positionButton.dataset.position;
            box.querySelectorAll("button[data-position]").forEach(function (button) {
                var on = button === positionButton;
                button.classList.toggle("bg-gray-800", on);
                button.classList.toggle("text-white", on);
                if (button.hasAttribute("data-emergency")) button.classList.toggle("text-gray-400", !on);
            });
            return;
        }
        var reorder = event.target.closest("[data-reorder]");
        if (reorder) {
            event.preventDefault();
            var reorderSlot = reorder.closest(".lineup-slot");
            var reorderCard = reorderSlot && reorderSlot.querySelector(".decision-card");
            if (!reorderCard) return;
            var pickedSlot = picked && picked.closest(".lineup-slot");
            var sameColumn = pickedSlot && reorderSlot.closest(".lineup-column") === pickedSlot.closest(".lineup-column");
            if (picked && sameColumn && reorderSlot !== pickedSlot) {
                place(reorderSlot, picked);
                return;
            }
            if (picked) picked.classList.remove("is-picked");
            picked = reorderCard;
            reorderCard.classList.add("is-picked");
            return;
        }
        if (event.target.closest("a, input, label, button")) return;
        var card = event.target.closest(".decision-card");
        if (card && card.closest("[data-stack]")) {
            if (tracksStarts() && card.dataset.startsCap !== undefined && card.dataset.startsCap !== "" && startsRoom(card) <= 0) return;
            if (picked) picked.classList.remove("is-picked");
            picked = card;
            card.classList.add("is-picked");
            return;
        }
        var slot = event.target.closest(".lineup-slot, .rotation-slot");
        if (slot && picked) place(slot, picked);
    });

    document.addEventListener("dragstart", function (event) {
        var handle = event.target.closest("[data-reorder]");
        if (handle) {
            var handleSlot = handle.closest(".lineup-slot");
            var handleCard = handleSlot && handleSlot.querySelector(".decision-card");
            if (!handleCard) {
                event.preventDefault();
                return;
            }
            event.dataTransfer.setData("text/plain", handleCard.dataset.kind + ":" + handleCard.dataset.player);
            event.dataTransfer.effectAllowed = "move";
            return;
        }
        if (event.target.closest("button")) {
            event.preventDefault();
            return;
        }
        var card = event.target.closest(".decision-card");
        if (!card) return;
        if (tracksStarts() && card.closest("[data-stack]") && card.dataset.startsCap !== undefined && card.dataset.startsCap !== "" && startsRoom(card) <= 0) {
            event.preventDefault();
            return;
        }
        event.dataTransfer.setData("text/plain", card.dataset.kind + ":" + card.dataset.player);
        event.dataTransfer.effectAllowed = "copy";
    });

    document.addEventListener("dragover", function (event) {
        var slot = event.target.closest(".lineup-slot, .rotation-slot");
        if (!slot) return;
        event.preventDefault();
        document.querySelectorAll(".is-over").forEach(function (other) {
            if (other !== slot) other.classList.remove("is-over");
        });
        slot.classList.add("is-over");
    });

    document.addEventListener("dragleave", function (event) {
        var slot = event.target.closest(".lineup-slot, .rotation-slot");
        if (slot && !slot.contains(event.relatedTarget)) slot.classList.remove("is-over");
    });

    document.addEventListener("drop", function (event) {
        var slot = event.target.closest(".lineup-slot, .rotation-slot");
        if (!slot) return;
        event.preventDefault();
        slot.classList.remove("is-over");
        var payload = event.dataTransfer.getData("text/plain").split(":");
        var card = sourceCard(payload[1], payload[0]);
        if (card) place(slot, card);
    });

    refreshStartCards();
})();
</script>
