{# ABOUTME: Drag a card from the stack onto a slot, or click a card and then a slot. #}
{# ABOUTME: A lineup column keeps each player once. The schedule grid takes pitchers. #}
<style>
    .decision-card.is-picked { outline: 2px solid #111; }
    .lineup-slot.is-over { background: #f3f4f6; }
    .decision-card.starts-spent { cursor: not-allowed; opacity: 0.55; }
    .slot-well { box-sizing: border-box; display: flex; min-height: 52px; }
    .slot-well:not(:has(.decision-card)) { background: #e5e7eb; }
    .slot-frame:not(:has(.decision-card)) .slot-remove { display: none; }
    .slot-well .decision-card { flex: 1 1 auto; width: 100%; padding-right: 1.25rem; }
</style>
<script>
(function () {
    var picked = null;

    function csrfToken() {
        var input = document.querySelector("[name=csrfmiddlewaretoken]");
        return input ? input.value : "";
    }

    function applyDesignation(playerId, designation) {
        document.querySelectorAll('.decision-card[data-kind="p"][data-player="' + playerId + '"]').forEach(function (card) {
            card.dataset.designation = designation;
            card.querySelectorAll("button[data-designation]").forEach(function (button) {
                var on = button.dataset.designation === designation;
                button.classList.toggle("bg-gray-800", on);
                button.classList.toggle("text-white", on);
            });
        });
    }

    function postDesignation(card, designation, previous) {
        if (!card.dataset.designationUrl) {
            applyDesignation(card.dataset.player, previous);
            return;
        }
        var token = csrfToken();
        var body = new URLSearchParams();
        body.set("player", card.dataset.player);
        body.set("designation", designation);
        if (token) body.set("csrfmiddlewaretoken", token);
        fetch(card.dataset.designationUrl, {
            method: "POST",
            headers: {"X-Requested-With": "fetch", "X-CSRFToken": token},
            body: body
        }).then(function (response) {
            if (!response.ok) applyDesignation(card.dataset.player, previous);
        }).catch(function () {
            applyDesignation(card.dataset.player, previous);
        });
    }

    function boardOf(slot) {
        return slot.closest("[data-lineup], [data-rotation], [data-bullpen], [data-starter-grid]");
    }

    function accepts(slot, card) {
        var board = boardOf(slot);
        if (!board || !card) return false;
        if (board.hasAttribute("data-lineup")) return card.dataset.kind === "h";
        return card.dataset.kind === "p";
    }

    function sourceCard(id, kind) {
        return document.querySelector('[data-stack] .decision-card[data-player="' + id + '"][data-kind="' + kind + '"]');
    }

    function positionCodes(card) {
        if (!card || !card.dataset.positions) return null;
        return card.dataset.positions.split(",").filter(function (code) { return code; });
    }

    function renderPositions(slot, codes) {
        var box = slot.querySelector("[data-position-buttons]");
        if (!box || !codes.length) return;
        var hidden = box.querySelector(".position-value");
        var current = hidden.value;
        if (codes.indexOf(current) < 0) current = codes.indexOf("DH") >= 0 ? "DH" : codes[0];
        hidden.value = current;
        box.querySelectorAll("button[data-position]").forEach(function (button) { button.remove(); });
        codes.forEach(function (code) {
            var button = document.createElement("button");
            button.type = "button";
            button.dataset.position = code;
            button.className = "border border-gray-400 px-1 leading-none" + (code === current ? " bg-gray-800 text-white" : "");
            button.textContent = code;
            box.insertBefore(button, hidden);
        });
    }

    function effectivePitcher(slot) {
        var input = slot.querySelector(".player-id");
        if (input && input.value) return input.value;
        return slot.dataset.autoStarter || "";
    }

    function scheduledOnGrid(playerId) {
        var count = 0;
        document.querySelectorAll("[data-starter-grid] .starter-slot").forEach(function (slot) {
            if (effectivePitcher(slot) === String(playerId)) count += 1;
        });
        return count;
    }

    function startsRoom(card) {
        if (!card || card.dataset.startsCap === undefined || card.dataset.startsCap === "") return null;
        var cap = Number(card.dataset.startsCap);
        var made = Number(card.dataset.startsMade || 0);
        var elsewhere = Number(card.dataset.startsElsewhere || 0);
        return cap - made - elsewhere - scheduledOnGrid(card.dataset.player);
    }

    function canTakeStart(card, slot) {
        var board = boardOf(slot);
        if (!board || !board.hasAttribute("data-starter-grid")) return true;
        var room = startsRoom(card);
        if (room === null) return true;
        if (effectivePitcher(slot) === String(card.dataset.player)) return true;
        return room > 0;
    }

    function refreshStartCards() {
        document.querySelectorAll("[data-stack] .decision-card[data-starts-cap]").forEach(function (card) {
            var open = startsRoom(card) > 0;
            card.draggable = open;
            card.classList.toggle("starts-spent", !open);
            if (open) card.removeAttribute("title");
            else card.title = "No starts left to schedule";
        });
    }

    function clearSlot(slot) {
        var body = slot.querySelector(".slot-body");
        if (body) {
            body.replaceChildren();
            if (slot.dataset.auto) body.textContent = slot.dataset.auto;
        }
        var input = slot.querySelector(".player-id");
        if (input) input.value = "";
        var box = slot.querySelector("[data-position-buttons]");
        if (box && box.dataset.all) renderPositions(slot, box.dataset.all.split(","));
    }

    function place(slot, card) {
        if (!accepts(slot, card) || !canTakeStart(card, slot)) return;
        var board = boardOf(slot);
        if (board && (board.hasAttribute("data-lineup") || board.hasAttribute("data-rotation") || board.hasAttribute("data-bullpen"))) {
            board.querySelectorAll(".lineup-slot, .rotation-slot").forEach(function (other) {
                var input = other.querySelector(".player-id");
                if (other !== slot && input && input.value === card.dataset.player) clearSlot(other);
            });
        }
        var body = slot.querySelector(".slot-body");
        var copy = card.cloneNode(true);
        copy.classList.remove("is-picked");
        body.replaceChildren(copy);
        var input = slot.querySelector(".player-id");
        if (input) input.value = card.dataset.player;
        var codes = positionCodes(card);
        if (codes) renderPositions(slot, codes);
        refreshStartCards();
    }

    document.addEventListener("click", function (event) {
        var usageButton = event.target.closest("button[data-bullpen-choice]");
        if (usageButton) {
            event.preventDefault();
            var group = usageButton.closest("[data-bullpen-logic]");
            group.querySelectorAll("button[data-bullpen-choice]").forEach(function (button) {
                var on = button === usageButton;
                button.classList.toggle("is-selected", on);
                button.classList.toggle("bg-gray-800", on);
                button.classList.toggle("text-white", on);
            });
            var input = group.querySelector("input[name=bullpen_logic]");
            if (input) input.value = usageButton.dataset.bullpenChoice;
            var note = group.querySelector(".bullpen-logic-note");
            if (note) note.textContent = usageButton.dataset.note || "";
            return;
        }
        var designationButton = event.target.closest("button[data-designation]");
        if (designationButton) {
            event.preventDefault();
            var named = designationButton.closest(".decision-card");
            if (!named) return;
            var designation = designationButton.dataset.designation;
            var previous = named.dataset.designation;
            if (designation === previous) return;
            applyDesignation(named.dataset.player, designation);
            postDesignation(named, designation, previous);
            return;
        }
        var clearLineup = event.target.closest("[data-clear-lineup]");
        if (clearLineup) {
            event.preventDefault();
            clearLineup.closest("[data-lineup]").querySelectorAll(".lineup-slot").forEach(clearSlot);
            return;
        }
        var clearButton = event.target.closest("[data-clear]");
        if (clearButton) {
            event.preventDefault();
            clearSlot(clearButton.closest(".lineup-slot, .rotation-slot"));
            refreshStartCards();
            return;
        }
        var positionButton = event.target.closest("button[data-position]");
        if (positionButton) {
            event.preventDefault();
            var box = positionButton.closest("[data-position-buttons]");
            box.querySelector(".position-value").value = positionButton.dataset.position;
            box.querySelectorAll("button[data-position]").forEach(function (button) {
                var on = button === positionButton;
                button.classList.toggle("bg-gray-800", on);
                button.classList.toggle("text-white", on);
            });
            return;
        }
        if (event.target.closest("a, input, label, button")) return;
        var card = event.target.closest(".decision-card");
        if (card && card.closest("[data-stack]")) {
            if (card.dataset.startsCap !== undefined && card.dataset.startsCap !== "" && startsRoom(card) <= 0) return;
            if (picked) picked.classList.remove("is-picked");
            picked = card;
            card.classList.add("is-picked");
            return;
        }
        var slot = event.target.closest(".lineup-slot, .rotation-slot");
        if (slot && picked) place(slot, picked);
    });

    document.addEventListener("dragstart", function (event) {
        if (event.target.closest("button")) {
            event.preventDefault();
            return;
        }
        var card = event.target.closest(".decision-card");
        if (!card) return;
        if (card.closest("[data-stack]") && card.dataset.startsCap !== undefined && card.dataset.startsCap !== "" && startsRoom(card) <= 0) {
            event.preventDefault();
            return;
        }
        event.dataTransfer.setData("text/plain", card.dataset.kind + ":" + card.dataset.player);
        event.dataTransfer.effectAllowed = "copy";
    });

    document.addEventListener("dragover", function (event) {
        if (event.target.closest(".lineup-slot, .rotation-slot")) event.preventDefault();
    });

    document.addEventListener("drop", function (event) {
        var slot = event.target.closest(".lineup-slot, .rotation-slot");
        if (!slot) return;
        event.preventDefault();
        var payload = event.dataTransfer.getData("text/plain").split(":");
        var card = sourceCard(payload[1], payload[0]);
        if (card) place(slot, card);
    });

    refreshStartCards();
})();
</script>
