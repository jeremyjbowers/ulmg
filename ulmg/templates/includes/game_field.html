{# ABOUTME: The live game from the second deck: a 16:9 field, white at home, gray on the road, and a ball track. #}
{# ABOUTME: Expects `field` from game_field.field_view. Sprites scale with depth; the names stay full size. #}
{% if field %}
<div class="game-screen">
    <svg class="game-field" viewBox="0 0 {{ field.width }} {{ field.height }}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The field from the second deck behind home plate">
        <defs>
            <pattern id="grass" width="8" height="8" patternUnits="userSpaceOnUse">
                <rect width="8" height="8" fill="#1c6b30"/>
                <rect width="4" height="4" fill="#25873c"/>
                <rect x="4" y="4" width="4" height="4" fill="#25873c"/>
                <rect x="6" y="1" width="1" height="1" fill="#145526"/>
                <rect x="1" y="6" width="1" height="1" fill="#145526"/>
            </pattern>
            <pattern id="dirt" width="8" height="8" patternUnits="userSpaceOnUse">
                <rect width="8" height="8" fill="#c48a52"/>
                <rect width="4" height="4" fill="#a87440"/>
                <rect x="4" y="4" width="4" height="4" fill="#a87440"/>
                <rect x="2" y="5" width="1" height="1" fill="#8a5e32"/>
            </pattern>
            <pattern id="seats" width="18" height="10" patternUnits="userSpaceOnUse">
                <rect width="18" height="10" fill="#6a5344"/>
                <rect x="1" y="2" width="6" height="4" fill="#c45c4a"/>
                <rect x="10" y="2" width="6" height="4" fill="#3d6ea8"/>
            </pattern>
            <symbol id="sprite-ready" viewBox="0 0 48 64">
                <rect x="16" y="6" width="18" height="5" fill="var(--cap)"/>
                <rect x="14" y="10" width="22" height="3" fill="var(--cap)"/>
                <rect x="30" y="12" width="8" height="3" fill="var(--cap)"/>
                <rect x="16" y="13" width="18" height="14" fill="#f3c7a4"/>
                <rect x="19" y="17" width="4" height="4" fill="#fff8ee"/>
                <rect x="27" y="17" width="4" height="4" fill="#fff8ee"/>
                <rect x="20" y="18" width="2" height="2" fill="#1a1a1a"/>
                <rect x="28" y="18" width="2" height="2" fill="#1a1a1a"/>
                <rect x="21" y="23" width="8" height="2" fill="#c46b62"/>
                <rect x="16" y="22" width="3" height="2" fill="#f0a0a0"/>
                <rect x="12" y="28" width="24" height="16" fill="#1c2430"/>
                <rect x="14" y="29" width="20" height="14" fill="var(--jersey)"/>
                <rect x="14" y="33" width="20" height="3" fill="var(--trim)"/>
                <rect x="21" y="30" width="6" height="2" fill="#fff8ee" opacity="0.85"/>
                <rect x="6" y="32" width="8" height="6" fill="var(--jersey)"/>
                <rect x="4" y="36" width="6" height="5" fill="#f3c7a4"/>
                <rect x="32" y="30" width="12" height="10" fill="#e6c27a"/>
                <rect x="34" y="32" width="8" height="6" fill="#c49a52"/>
                <rect x="36" y="34" width="3" height="3" fill="#8d6733"/>
                <rect x="14" y="43" width="8" height="12" fill="var(--pants)"/>
                <rect x="26" y="43" width="8" height="10" fill="var(--pants)"/>
                <rect x="12" y="54" width="11" height="4" fill="#1a1a1a"/>
                <rect x="25" y="52" width="11" height="4" fill="#1a1a1a"/>
                <rect x="12" y="57" width="4" height="2" fill="#f4f0e6"/>
                <rect x="32" y="55" width="4" height="2" fill="#f4f0e6"/>
            </symbol>
            <symbol id="sprite-stand" viewBox="0 0 48 64">
                <rect x="15" y="1" width="18" height="5" fill="var(--cap)"/>
                <rect x="13" y="5" width="22" height="3" fill="var(--cap)"/>
                <rect x="31" y="7" width="8" height="3" fill="var(--cap)"/>
                <rect x="16" y="8" width="16" height="13" fill="#f3c7a4"/>
                <rect x="19" y="12" width="3" height="3" fill="#1a1a1a"/>
                <rect x="26" y="12" width="3" height="3" fill="#1a1a1a"/>
                <rect x="20" y="11" width="1" height="1" fill="#fff8ee"/>
                <rect x="27" y="11" width="1" height="1" fill="#fff8ee"/>
                <rect x="20" y="17" width="7" height="2" fill="#c46b62"/>
                <rect x="16" y="15" width="3" height="2" fill="#f0a0a0"/>
                <rect x="15" y="22" width="18" height="16" fill="#1c2430"/>
                <rect x="16" y="23" width="16" height="14" fill="var(--jersey)"/>
                <rect x="16" y="27" width="16" height="3" fill="var(--trim)"/>
                <rect x="19" y="24" width="10" height="2" fill="#fff8ee" opacity="0.8"/>
                <rect x="8" y="26" width="8" height="5" fill="var(--jersey)"/>
                <rect x="6" y="30" width="6" height="4" fill="#f3c7a4"/>
                <rect x="32" y="28" width="10" height="9" fill="#e6c27a"/>
                <rect x="34" y="30" width="6" height="5" fill="#c49a52"/>
                <rect x="18" y="38" width="6" height="16" fill="var(--pants)"/>
                <rect x="26" y="38" width="6" height="16" fill="var(--pants)"/>
                <rect x="16" y="54" width="9" height="4" fill="#1a1a1a"/>
                <rect x="25" y="54" width="9" height="4" fill="#1a1a1a"/>
                <rect x="16" y="57" width="3" height="2" fill="#f4f0e6"/>
                <rect x="31" y="57" width="3" height="2" fill="#f4f0e6"/>
            </symbol>
            <symbol id="sprite-hands" viewBox="0 0 48 64">
                <rect x="18" y="4" width="16" height="5" fill="var(--cap)"/>
                <rect x="16" y="8" width="20" height="3" fill="var(--cap)"/>
                <rect x="32" y="10" width="7" height="3" fill="var(--cap)"/>
                <rect x="18" y="11" width="16" height="12" fill="#f3c7a4"/>
                <rect x="21" y="15" width="3" height="3" fill="#1a1a1a"/>
                <rect x="28" y="15" width="3" height="3" fill="#1a1a1a"/>
                <rect x="22" y="19" width="6" height="2" fill="#c46b62"/>
                <rect x="14" y="24" width="22" height="12" fill="#1c2430"/>
                <rect x="15" y="25" width="20" height="10" fill="var(--jersey)"/>
                <rect x="15" y="28" width="20" height="3" fill="var(--trim)"/>
                <rect x="10" y="32" width="6" height="10" fill="var(--jersey)"/>
                <rect x="32" y="32" width="6" height="10" fill="var(--jersey)"/>
                <rect x="8" y="40" width="8" height="5" fill="#f3c7a4"/>
                <rect x="32" y="40" width="8" height="5" fill="#f3c7a4"/>
                <rect x="6" y="42" width="10" height="7" fill="#e6c27a"/>
                <rect x="16" y="36" width="7" height="16" fill="var(--pants)"/>
                <rect x="25" y="36" width="7" height="16" fill="var(--pants)"/>
                <rect x="14" y="52" width="10" height="4" fill="#1a1a1a"/>
                <rect x="24" y="52" width="10" height="4" fill="#1a1a1a"/>
            </symbol>
            <symbol id="sprite-pitcher" viewBox="0 0 48 64">
                <rect x="16" y="2" width="16" height="5" fill="#f7f4ec"/>
                <rect x="14" y="6" width="20" height="3" fill="var(--cap)"/>
                <rect x="16" y="9" width="16" height="12" fill="#f3c7a4"/>
                <rect x="19" y="13" width="3" height="3" fill="#1a1a1a"/>
                <rect x="26" y="13" width="3" height="3" fill="#1a1a1a"/>
                <rect x="21" y="17" width="6" height="2" fill="#c46b62"/>
                <rect x="14" y="22" width="18" height="14" fill="#1c2430"/>
                <rect x="15" y="23" width="16" height="12" fill="var(--jersey)"/>
                <rect x="15" y="27" width="16" height="3" fill="var(--trim)"/>
                <rect x="4" y="10" width="8" height="6" fill="var(--jersey)"/>
                <rect x="2" y="8" width="6" height="5" fill="#f7f4ec"/>
                <rect x="3" y="9" width="3" height="3" fill="#d23b3b"/>
                <rect x="30" y="26" width="8" height="5" fill="var(--jersey)"/>
                <rect x="36" y="28" width="8" height="7" fill="#e6c27a"/>
                <rect x="16" y="36" width="7" height="14" fill="var(--pants)"/>
                <rect x="24" y="28" width="6" height="10" fill="var(--pants)"/>
                <rect x="22" y="24" width="8" height="6" fill="var(--pants)"/>
                <rect x="14" y="50" width="10" height="4" fill="#1a1a1a"/>
                <rect x="30" y="36" width="8" height="4" fill="#1a1a1a"/>
            </symbol>
            <symbol id="sprite-catcher" viewBox="0 0 48 64">
                <rect x="12" y="6" width="24" height="8" fill="#d9dee8"/>
                <rect x="14" y="8" width="8" height="4" fill="#9aa3b2"/>
                <rect x="26" y="8" width="8" height="4" fill="#9aa3b2"/>
                <rect x="18" y="14" width="12" height="6" fill="#f3c7a4"/>
                <rect x="10" y="20" width="28" height="16" fill="#1c2430"/>
                <rect x="12" y="21" width="24" height="14" fill="var(--jersey)"/>
                <rect x="12" y="25" width="24" height="3" fill="var(--trim)"/>
                <rect x="16" y="22" width="16" height="2" fill="#fff8ee" opacity="0.75"/>
                <rect x="0" y="26" width="12" height="12" fill="#e6c27a"/>
                <rect x="2" y="28" width="8" height="8" fill="#c49a52"/>
                <rect x="36" y="28" width="10" height="8" fill="var(--jersey)"/>
                <rect x="12" y="36" width="10" height="14" fill="var(--pants)"/>
                <rect x="26" y="36" width="10" height="14" fill="var(--pants)"/>
                <rect x="8" y="50" width="14" height="5" fill="#1a1a1a"/>
                <rect x="26" y="50" width="14" height="5" fill="#1a1a1a"/>
            </symbol>
            <symbol id="sprite-batter" viewBox="0 0 48 64">
                <rect x="14" y="2" width="16" height="5" fill="var(--cap)"/>
                <rect x="12" y="6" width="20" height="3" fill="var(--cap)"/>
                <rect x="28" y="8" width="8" height="3" fill="var(--cap)"/>
                <rect x="14" y="9" width="16" height="13" fill="#f3c7a4"/>
                <rect x="22" y="13" width="3" height="3" fill="#1a1a1a"/>
                <rect x="26" y="13" width="3" height="3" fill="#1a1a1a"/>
                <rect x="22" y="18" width="6" height="2" fill="#c46b62"/>
                <rect x="12" y="22" width="20" height="16" fill="#1c2430"/>
                <rect x="13" y="23" width="18" height="14" fill="var(--jersey)"/>
                <rect x="13" y="27" width="18" height="3" fill="var(--trim)"/>
                <rect x="30" y="18" width="6" height="4" fill="#f3c7a4"/>
                <rect x="34" y="14" width="12" height="3" fill="#e6d2a2"/>
                <rect x="42" y="8" width="4" height="8" fill="#c4a56a"/>
                <rect x="44" y="6" width="3" height="4" fill="#8d6733"/>
                <rect x="14" y="38" width="7" height="16" fill="var(--pants)"/>
                <rect x="23" y="38" width="7" height="16" fill="var(--pants)"/>
                <rect x="12" y="54" width="10" height="4" fill="#1a1a1a"/>
                <rect x="22" y="54" width="10" height="4" fill="#1a1a1a"/>
            </symbol>
            <symbol id="sprite-runner" viewBox="0 0 48 64">
                <rect x="18" y="4" width="16" height="5" fill="var(--cap)"/>
                <rect x="16" y="8" width="20" height="3" fill="var(--cap)"/>
                <rect x="18" y="11" width="16" height="12" fill="#f3c7a4"/>
                <rect x="22" y="15" width="3" height="3" fill="#1a1a1a"/>
                <rect x="28" y="15" width="3" height="3" fill="#1a1a1a"/>
                <rect x="23" y="19" width="6" height="2" fill="#c46b62"/>
                <rect x="14" y="24" width="20" height="14" fill="#1c2430"/>
                <rect x="15" y="25" width="18" height="12" fill="var(--jersey)"/>
                <rect x="15" y="29" width="18" height="3" fill="var(--trim)"/>
                <rect x="6" y="22" width="10" height="5" fill="var(--jersey)"/>
                <rect x="2" y="20" width="6" height="4" fill="#f3c7a4"/>
                <rect x="32" y="28" width="10" height="5" fill="var(--jersey)"/>
                <rect x="14" y="38" width="7" height="8" fill="var(--pants)"/>
                <rect x="22" y="38" width="14" height="6" fill="var(--pants)"/>
                <rect x="32" y="42" width="8" height="6" fill="var(--pants)"/>
                <rect x="12" y="46" width="10" height="4" fill="#1a1a1a"/>
                <rect x="36" y="46" width="10" height="4" fill="#1a1a1a"/>
            </symbol>
        </defs>

        <rect width="1600" height="900" fill="url(#grass)"/>
        <rect width="1600" height="118" fill="url(#seats)"/>
        <rect y="118" width="1600" height="18" fill="#4a3428"/>
        <rect y="136" width="1600" height="36" fill="#d7c4a3"/>
        <rect y="136" width="46" height="36" fill="#f4f0e6"/>
        <rect x="140" y="136" width="46" height="36" fill="#f4f0e6"/>
        <rect x="280" y="136" width="46" height="36" fill="#f4f0e6"/>
        <rect x="420" y="136" width="46" height="36" fill="#f4f0e6"/>
        <rect x="560" y="136" width="46" height="36" fill="#f4f0e6"/>
        <rect x="700" y="136" width="46" height="36" fill="#f4f0e6"/>
        <rect x="840" y="136" width="46" height="36" fill="#f4f0e6"/>
        <rect x="980" y="136" width="46" height="36" fill="#f4f0e6"/>
        <rect x="1120" y="136" width="46" height="36" fill="#f4f0e6"/>
        <rect x="1260" y="136" width="46" height="36" fill="#f4f0e6"/>
        <rect x="1400" y="136" width="46" height="36" fill="#f4f0e6"/>
        <rect x="1540" y="136" width="60" height="36" fill="#f4f0e6"/>
        <rect y="172" width="1600" height="28" fill="#6b4a32"/>
        <rect y="210" width="1600" height="70" fill="#000000" opacity="0.08"/>
        <rect y="430" width="1600" height="50" fill="#000000" opacity="0.05"/>

        <polygon points="{{ field.bases.third.x }},{{ field.bases.third.y }} {{ field.bases.second.x }},{{ field.bases.second.y }} {{ field.bases.first.x }},{{ field.bases.first.y }} {{ field.home.x }},{{ field.home.y }}" fill="url(#dirt)"/>
        <ellipse cx="{{ field.mound.x }}" cy="{{ field.mound.y }}" rx="70" ry="22" fill="#8d5e36"/>
        <ellipse cx="{{ field.mound.x }}" cy="{{ field.mound.y|add:'-6' }}" rx="34" ry="12" fill="#c4894e"/>
        <ellipse cx="{{ field.home.x }}" cy="{{ field.home.y|add:'18' }}" rx="150" ry="52" fill="url(#dirt)"/>

        <line x1="{{ field.home.x }}" y1="{{ field.home.y }}" x2="{{ field.foul_left.x }}" y2="{{ field.foul_left.y }}" stroke="#f7f3ea" stroke-width="4"/>
        <line x1="{{ field.home.x }}" y1="{{ field.home.y }}" x2="{{ field.foul_right.x }}" y2="{{ field.foul_right.y }}" stroke="#f7f3ea" stroke-width="4"/>
        <polyline points="{{ field.bases.third.x }},{{ field.bases.third.y }} {{ field.home.x }},{{ field.home.y }} {{ field.bases.first.x }},{{ field.bases.first.y }} {{ field.bases.second.x }},{{ field.bases.second.y }} {{ field.bases.third.x }},{{ field.bases.third.y }}" fill="none" stroke="#f7f3ea" stroke-width="3"/>

        <polygon points="{{ field.home.x|add:'-26' }},{{ field.home.y|add:'-6' }} {{ field.home.x|add:'26' }},{{ field.home.y|add:'-6' }} {{ field.home.x|add:'26' }},{{ field.home.y|add:'14' }} {{ field.home.x }},{{ field.home.y|add:'34' }} {{ field.home.x|add:'-26' }},{{ field.home.y|add:'14' }}" fill="#f7f3ea"/>
        <g transform="translate({{ field.bases.first.x }}, {{ field.bases.first.y }})"><rect x="-12" y="-12" width="24" height="24" transform="rotate(45)" fill="#f7f3ea"/></g>
        <g transform="translate({{ field.bases.second.x }}, {{ field.bases.second.y }})"><rect x="-10" y="-10" width="20" height="20" transform="rotate(45)" fill="#f7f3ea"/></g>
        <g transform="translate({{ field.bases.third.x }}, {{ field.bases.third.y }})"><rect x="-12" y="-12" width="24" height="24" transform="rotate(45)" fill="#f7f3ea"/></g>

        {% for fielder in field.fielders %}{% if fielder.position != "C" %}
        <g class="fielder" transform="translate({{ fielder.x }}, {{ fielder.y }})" data-name="{{ fielder.name }}" data-position="{{ fielder.position }}" data-fielding="{{ fielder.fielding }}" data-uniform="{{ fielder.uniform }}" data-stance="{{ fielder.stance }}" data-scale="{{ fielder.scale }}" style="--jersey: {{ fielder.jersey }}; --pants: {{ fielder.pants }}; --cap: {{ fielder.cap }}; --trim: {{ fielder.trim }}">
            <title>{{ fielder.name }}, {{ fielder.position }}, {{ fielder.fielding }}</title>
            <ellipse cx="0" cy="4" rx="26" ry="8" fill="#102616" opacity="0.35"/>
            <g transform="scale({{ fielder.scale }})">
                <use href="#sprite-{{ fielder.stance }}" x="-24" y="-64" width="48" height="64"/>
            </g>
            <a href="/players/{{ fielder.player_id }}/"><text class="plate-name" x="{{ fielder.lx }}" y="{{ fielder.ly }}" text-anchor="{{ fielder.anchor }}">{{ fielder.short_name }}</text></a>
            <text class="plate-meta" x="{{ fielder.lx }}" y="{{ fielder.ly|add:22 }}" text-anchor="{{ fielder.anchor }}">{{ fielder.position }} {{ fielder.fielding }}</text>
        </g>
        {% endif %}{% endfor %}

        {% if field.pitcher %}
        <g class="pitcher" transform="translate({{ field.pitcher.x }}, {{ field.pitcher.y }})" data-name="{{ field.pitcher.name }}" data-uniform="{{ field.pitcher.uniform }}" data-scale="{{ field.pitcher.scale }}" style="--jersey: {{ field.pitcher.jersey }}; --pants: {{ field.pitcher.pants }}; --cap: {{ field.pitcher.cap }}; --trim: {{ field.pitcher.trim }}">
            <title>{{ field.pitcher.name }}</title>
            <ellipse cx="0" cy="4" rx="16" ry="6" fill="#102616" opacity="0.35"/>
            <g transform="scale({{ field.pitcher.scale }})">
                <use href="#sprite-pitcher" x="-24" y="-64" width="48" height="64"/>
            </g>
        </g>
        <g class="mound-card" transform="translate(1048, 12)" data-xfip="{{ field.pitcher.xfip|default_if_none:'' }}" data-pitches="{{ field.pitcher.pitches }}" data-effort="{{ field.pitcher.effort }}" data-ceiling="{{ field.pitcher.ceiling }}">
            <rect width="536" height="108" fill="#14161f" stroke="#ffb000" stroke-width="4"/>
            <text class="card-name" x="18" y="36">{{ field.pitcher.short_name }}</text>
            <text class="card-line" x="18" y="66">xFIP {{ field.pitcher.xfip_label }}</text>
            <text class="card-line" x="280" y="66">{{ field.pitcher.pitches }} pitches</text>
            <rect class="fatigue-track" x="18" y="80" width="160" height="14" fill="#4a4e66"/>
            <rect class="fatigue-fill fatigue-{{ field.pitcher.fatigue_tone }}" x="18" y="80" width="{{ field.pitcher.fatigue_width }}" height="14"/>
            <text class="card-line" x="192" y="94">Fatigue {{ field.pitcher.fatigue_label }}</text>
        </g>
        {% endif %}

        {% for runner in field.runners %}
        <g class="runner" transform="translate({{ runner.x }}, {{ runner.y }})" data-base="{{ runner.base }}" data-name="{{ runner.name }}" data-uniform="{{ runner.uniform }}" style="--jersey: {{ runner.jersey }}; --pants: {{ runner.pants }}; --cap: {{ runner.cap }}; --trim: {{ runner.trim }}">
            <title>{{ runner.name }} on {{ runner.base }}</title>
            <g transform="scale({{ runner.scale }}){% if runner.base == 'first' %} scale(-1, 1){% endif %}">
                <use href="#sprite-runner" x="-24" y="-64" width="48" height="64"/>
            </g>
            <text class="plate-name" y="-150" text-anchor="middle">{{ runner.short_name }}</text>
        </g>
        {% endfor %}

        {% if field.batter %}
        <g class="batter" transform="translate({{ field.batter.x }}, {{ field.batter.y }})" data-box="{{ field.batter.box }}" data-bats="{{ field.batter.hand }}" data-name="{{ field.batter.name }}" data-uniform="{{ field.batter.uniform }}" style="--jersey: {{ field.batter.jersey }}; --pants: {{ field.batter.pants }}; --cap: {{ field.batter.cap }}; --trim: {{ field.batter.trim }}">
            <title>{{ field.batter.name }}, bats {{ field.batter.hand }}</title>
            <ellipse cx="0" cy="4" rx="18" ry="6" fill="#102616" opacity="0.35"/>
            <g transform="scale({{ field.batter.scale }}){% if field.batter.box == 'right' %} scale(-1, 1){% endif %}">
                <use href="#sprite-batter" x="-24" y="-64" width="48" height="64"/>
            </g>
            <a href="/players/{{ field.batter.player_id }}/"><text class="plate-name" x="{{ field.batter.lx }}" y="{{ field.batter.ly }}" text-anchor="{{ field.batter.anchor }}">{{ field.batter.short_name }}</text></a>
            <text class="plate-meta" x="{{ field.batter.lx }}" y="{{ field.batter.ly|add:22 }}" text-anchor="{{ field.batter.anchor }}">{{ field.batter.hand }}HB</text>
        </g>
        {% endif %}

        {% for fielder in field.fielders %}{% if fielder.position == "C" %}
        <g class="fielder" transform="translate({{ fielder.x }}, {{ fielder.y }})" data-name="{{ fielder.name }}" data-position="{{ fielder.position }}" data-fielding="{{ fielder.fielding }}" data-uniform="{{ fielder.uniform }}" data-stance="catcher" data-scale="{{ fielder.scale }}" style="--jersey: {{ fielder.jersey }}; --pants: {{ fielder.pants }}; --cap: {{ fielder.cap }}; --trim: {{ fielder.trim }}">
            <title>{{ fielder.name }}, {{ fielder.position }}, {{ fielder.fielding }}</title>
            <g transform="scale({{ fielder.scale }})">
                <use href="#sprite-catcher" x="-24" y="-64" width="48" height="64"/>
            </g>
            <a href="/players/{{ fielder.player_id }}/"><text class="plate-name" x="{{ fielder.lx }}" y="{{ fielder.ly }}" text-anchor="{{ fielder.anchor }}">{{ fielder.short_name }}</text></a>
            <text class="plate-meta" x="{{ fielder.lx }}" y="{{ fielder.ly|add:22 }}" text-anchor="{{ fielder.anchor }}">{{ fielder.position }} {{ fielder.fielding }}</text>
        </g>
        {% endif %}{% endfor %}

        {% if field.banner %}
        <g class="result-banner" data-outcome="{{ field.banner.outcome }}">
            <rect class="marquee" y="{{ field.play_height }}" width="{{ field.width }}" height="{{ field.marquee_height }}" fill="#14161f"/>
            <rect y="{{ field.play_height }}" width="{{ field.width }}" height="6" fill="#ffb000"/>
            <text class="banner-word" x="800" y="{{ field.banner_y }}" text-anchor="middle">{{ field.banner.label }}{% if field.banner.count %} {{ field.banner.count }}{% endif %}</text>
        </g>
        {% if field.banner.path %}
        <g class="ball-play" data-kind="{{ field.banner.kind }}" data-outcome="{{ field.banner.outcome }}">
            <path id="ball-track" class="ball-track ball-track-{{ field.banner.kind }}" pathLength="100" d="{{ field.banner.path }}"/>
            <g class="ball">
                <animateMotion dur="1.05s" fill="freeze" calcMode="linear">
                    <mpath href="#ball-track"/>
                </animateMotion>
                <rect x="-9" y="-9" width="18" height="18" fill="#ffffff"/>
                <rect x="-6" y="-6" width="5" height="5" fill="#d23b3b"/>
                <rect x="2" y="2" width="5" height="5" fill="#d23b3b"/>
            </g>
        </g>
        {% endif %}
        {% endif %}
    </svg>
</div>
{% endif %}
