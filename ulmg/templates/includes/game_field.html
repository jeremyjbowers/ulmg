{# ABOUTME: Mount for the SNES field: Django writes the live JSON, game_field.js draws the 320×180 SVG. #}
{# ABOUTME: Expects `field` from game_field.field_view. The line score and call buttons stay in HTML. #}
{% if field %}
<div class="game-screen">
    {{ field|json_script:"game-field-data" }}
    <div id="game-field" class="game-field" role="img" aria-label="The field from behind home plate"></div>
</div>
{% endif %}
