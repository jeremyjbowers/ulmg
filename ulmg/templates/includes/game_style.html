{# ABOUTME: The 16-bit game screen: the bezel, the pixel field, the call buttons and the substitution modals. #}
{# ABOUTME: Included from the game page head. The field art itself lives in the SVG. #}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
    .game-shell { max-width: none; }
    .game-stage {
        height: calc(100dvh - var(--header-offset, 10rem) - 4.75rem);
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
        overflow: hidden;
    }
    .game-below { max-width: 52rem; margin: 1.25rem auto 0; }
    .game-hud, .game-line, .game-paused, .game-need { flex: 0 0 auto; }
    .game-hud {
        background: #14161f;
        color: #f4efe2;
        border: 4px solid #0c0d12;
        box-shadow: inset 0 0 0 3px #3a3d55;
        font-family: "Press Start 2P", ui-monospace, monospace;
        font-size: 9px;
        line-height: 1.8;
        padding: 8px 10px;
    }
    .game-scoreboard { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .game-score-copy { flex: 0 1 auto; }
    .game-line { flex: 1 1 16rem; min-width: 14rem; }
    .game-hud .game-scoreline { color: #ffb000; font-size: 12px; line-height: 1.6; }
    .out-pips { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: middle; }
    .out-pips span {
        width: 8px; height: 8px; border: 2px solid #f4efe2; display: inline-block; background: transparent;
    }
    .out-pips span.is-out { background: #ffb000; border-color: #ffb000; }

    .game-line .line-score {
        background: #14161f;
        color: #f4efe2;
        border: 4px solid #0c0d12;
        box-shadow: inset 0 0 0 3px #3a3d55;
        font-family: "Press Start 2P", ui-monospace, monospace;
        font-size: 8px;
        line-height: 1.6;
    }
    .game-line .line-score thead,
    .game-line .line-score tr { background: #14161f; color: #f4efe2; }
    .game-line .line-score th,
    .game-line .line-score td {
        border-color: #2a2d3a;
        padding: 5px 4px;
        color: #f4efe2;
    }
    .game-line .line-score .is-now { color: #ffb000; }
    .game-screen {
        background: #10131a;
        border: 4px solid #0c0d12;
        box-shadow: inset 0 0 0 4px #3a3d55, 0 8px 0 #0c0d12;
        padding: 0;
        margin: 0;
        flex: 1 1 0;
        min-height: 0;
        position: relative;
        overflow: hidden;
    }
    .game-field {
        position: absolute;
        top: 6px;
        left: 6px;
        width: calc(100% - 12px);
        height: calc(100% - 12px);
        min-height: 0;
        shape-rendering: crispEdges;
        background: #1f7a34;
    }
    .game-field .plate-name,
    .game-field .plate-meta,
    .game-field .card-name,
    .game-field .card-line,
    .game-field .banner-word,
    .game-field .banner-count {
        font-family: "Press Start 2P", ui-monospace, monospace;
        fill: #f7f3ea;
    }
    .game-field .plate-name { font-size: 18px; stroke: #102616; stroke-width: 4px; paint-order: stroke fill; }
    .game-field .plate-meta, .game-field .card-line { font-size: 14px; fill: #ffe7a3; }
    .game-field .plate-meta { stroke: #102616; stroke-width: 4px; paint-order: stroke fill; }
    .game-field .card-name { font-size: 18px; fill: #ffb000; }
    .game-field a:hover .plate-name { fill: #ffffff; }
    .game-field .banner-word {
        font-size: 32px;
        fill: #ffb000;
        stroke: #3a2200;
        stroke-width: 6px;
        paint-order: stroke fill;
    }
    .game-field .banner-count {
        font-size: 16px;
        fill: #fff8e8;
        stroke: #1a1a1a;
        stroke-width: 4px;
        paint-order: stroke fill;
    }
    .ball-track {
        fill: none;
        stroke: #fff8e8;
        stroke-width: 6;
        stroke-dasharray: 2 2;
        stroke-dashoffset: 100;
        animation: draw-track 1.05s linear forwards;
    }
    .ball-track-fly { stroke: #ffe27a; }
    .ball-track-line { stroke: #ffffff; }
    .ball-track-ground, .ball-track-bunt { stroke: #f0e2c0; }
    .fatigue-fill { fill: #3ddc97; }
    .fatigue-warm { fill: #ffb000; }
    .fatigue-hot { fill: #e23b3b; }
    .ball-puff { opacity: 0; animation: puff 0.35s linear 0.85s forwards; }
    @keyframes draw-track { to { stroke-dashoffset: 0; } }
    @keyframes puff { to { opacity: 1; } }

    .game-actions { flex: 0 0 auto; }
    .game-calls { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
    .game-step { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
    .game-btn {
        font-family: "Press Start 2P", ui-monospace, monospace;
        font-size: 8px;
        line-height: 1.7;
        background: #f4efe2;
        color: #1a1a1a;
        border: 3px solid #1a1a1a;
        box-shadow: 4px 4px 0 #1a1a1a;
        padding: 10px 12px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
    }
    .game-btn:hover { transform: translate(1px, 1px); box-shadow: 3px 3px 0 #1a1a1a; color: #1a1a1a; }
    .game-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #1a1a1a; }
    .game-btn-swing { background: #ffb000; font-size: 11px; min-height: 52px; padding: 12px 16px; }
    .game-btn-call.is-live { background: #fff1b8; outline: 2px dashed #8d1e2f; outline-offset: 2px; }
    .game-sub-note { font-size: 12px; color: #4b5563; margin-bottom: 8px; }

    .game-modal { display: none; }
    .game-modal:target, .game-modal.is-open {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 60;
    }
    .game-modal-backdrop { position: absolute; inset: 0; background: rgba(8, 10, 16, 0.78); }
    .game-modal-card {
        position: relative;
        z-index: 1;
        width: min(28rem, calc(100% - 1.5rem));
        margin: 8vh auto;
        background: #f6edd8;
        color: #1a1a1a;
        border: 4px solid #1a1a1a;
        box-shadow: 8px 8px 0 #1a1a1a;
        padding: 14px;
        max-height: 80vh;
        overflow: auto;
    }
    .game-modal-card h2 {
        font-family: "Press Start 2P", ui-monospace, monospace;
        font-size: 10px;
        line-height: 1.6;
        margin: 0 28px 12px 0;
    }
    .game-modal-close {
        position: absolute;
        top: 10px;
        right: 10px;
        font-family: "Press Start 2P", ui-monospace, monospace;
        font-size: 8px;
        color: #1a1a1a;
    }
    .game-matchup { background: #14161f; color: #f4efe2; border: 4px solid #0c0d12; padding: 8px; }
    .game-matchup h2 {
        font-family: "Press Start 2P", ui-monospace, monospace;
        font-size: 8px;
        color: #ffb000;
        margin-bottom: 6px;
    }
    .game-odd { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid #2a2d3a; padding: 3px 0; font-size: 11px; }
    @media (max-width: 640px) {
        .game-btn, .game-btn-swing { width: 100%; text-align: center; }
    }
</style>
