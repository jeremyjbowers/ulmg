{# ABOUTME: The game HUD's page stylesheet: the scoreboard, the cards, the top-down field, the calls and the substitution panel. #}
{# ABOUTME: Colors are tokens with a light and a dark set. Included from the game page head only. #}
<style>
:root {
  --page: #f3f1ea; --ink: #1c1b18; --muted: #5d5a52; --panel: #ffffff; --rule: #d6d2c6;
  --board: #17382b; --board-ink: #f4ecd2; --board-dim: #9fb3a4; --board-rule: #2f5a47;
  --accent: #f2c230; --accent-ink: #1c1b18; --accent-edge: #6b4e00;
  --grass: #3f8a4e; --grass-out: #2c6a3c; --turf: #2f8f6a; --turf-out: #3a4a52; --dirt: #c58a4d; --dirt-turf: #b98c5a;
  --wall: #17382b; --wall-tall: #0c5b3a;
  --good: #1f7a3d; --bad: #b3261e; --warm: #d99a1c; --btn: #ffffff; --btn-ink: #1c1b18; --off: #8a867b;
  --tag: #f4ecd2; --tag-low: #f6d9d2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #14140f; --ink: #f1eee4; --muted: #b3aea0; --panel: #1f1f18; --rule: #3a392f;
    --btn: #2a2a21; --btn-ink: #f1eee4; --good: #6fcf8a; --bad: #ff8a80; --off: #7d7a70;
  }
}
:root[data-theme="dark"] {
  --page: #14140f; --ink: #f1eee4; --muted: #b3aea0; --panel: #1f1f18; --rule: #3a392f;
  --btn: #2a2a21; --btn-ink: #f1eee4; --good: #6fcf8a; --bad: #ff8a80; --off: #7d7a70;
}
/* The page takes the HUD's colors; the site header keeps its own light ones. */
body:has(#hud) { background: var(--page); color: var(--ink); }
body:has(#hud) header { background: #ffffff; color: #000000; }
.hud-page { max-width: 1280px; margin: 0 auto; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.hud-page .num { font-variant-numeric: tabular-nums; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hud-alert { border: 2px solid var(--bad); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 10px 14px; margin: 0 0 10px; font-size: 15px; }
.hud-alert form { display: inline; }

/* Scoreboard */
.hud-board { background: var(--board); color: var(--board-ink); border-radius: 10px 10px 0 0; padding: 8px 16px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.hud-line { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.hud-line th { font-size: 13px; font-weight: 600; color: var(--board-dim); padding: 2px 0; text-align: center; }
.hud-line td { font-size: 22px; font-weight: 700; text-align: center; padding: 2px 0; min-width: 34px; border-top: 1px solid var(--board-rule); }
.hud-line td.team { text-align: left; font-size: 20px; letter-spacing: .04em; padding-left: 4px; min-width: 76px; }
.hud-line .tot { border-left: 2px solid var(--board-rule); }
.hud-line td.runs { color: var(--accent); }
.hud-line .now { background: rgba(242,194,48,.16); }
.hud-line th.now { color: var(--accent); }
.hud-line td.dim { color: var(--board-dim); font-weight: 400; }
.hud-line td.flash { animation: hud-flash 900ms ease-out; }
@keyframes hud-flash { 0% { background: var(--accent); color: var(--accent-ink); } 100% { background: rgba(242,194,48,.16); } }
.hud-situation { text-align: right; min-width: 170px; }
.hud-inning { font-size: 26px; font-weight: 800; margin: 0; }
.hud-outs { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 4px; font-size: 15px; color: var(--board-dim); }
.out-light { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--board-dim); display: inline-block; }
.out-light.on { background: #e5483b; border-color: #e5483b; }

/* Cards and field */
.hud-mid { background: var(--panel); border: 1px solid var(--rule); border-top: 0; display: grid; grid-template-columns: 290px 1fr 290px; }
.hud-card { padding: 14px 16px; }
.hud-card + .hud-field, .hud-field + .hud-card { border-left: 1px solid var(--rule); }
.hud-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.hud-who { font-size: 22px; font-weight: 800; margin: 2px 0 0; }
.hud-who a { color: inherit; text-decoration: none; }
.hud-who a:hover { text-decoration: underline; }
.hud-sub { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
.hud-splits { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
.hud-splits th { font-size: 12px; color: var(--muted); font-weight: 600; text-align: right; padding: 2px 0; }
.hud-splits td { text-align: right; padding: 4px 0; border-top: 1px solid var(--rule); }
.hud-splits th:first-child, .hud-splits td:first-child { text-align: left; }
.hud-splits tr.hot td { font-weight: 800; background: rgba(242,194,48,.18); }
.hud-note { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
.hud-note b { color: var(--ink); }
.hud-due { margin: 12px 0 0; padding: 0; list-style: none; font-size: 15px; }
.hud-due li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-top: 1px solid var(--rule); }
.hud-due .pos { color: var(--muted); white-space: nowrap; }
.hud-meter { height: 12px; border-radius: 6px; background: var(--rule); overflow: hidden; margin: 6px 0 2px; }
.hud-meter i { display: block; height: 100%; background: var(--good); }
.hud-meter.warm i { background: var(--warm); }
.hud-meter.hot i { background: var(--bad); }
.hud-odds { margin: 10px 0 0; padding: 0; list-style: none; font-size: 15px; }
.hud-odds li { display: grid; grid-template-columns: 92px 1fr 52px; gap: 8px; align-items: center; padding: 2px 0; }
.hud-odds .bar { height: 10px; background: var(--rule); border-radius: 5px; overflow: hidden; }
.hud-odds .bar i { display: block; height: 100%; background: var(--muted); }
.hud-odds .good .bar i { background: var(--good); }
.hud-odds .pct { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.hud-field { position: relative; background: var(--grass-out); min-width: 0; }
.hud-field.turf { background: var(--turf-out); }
.hud-field svg { display: block; width: 100%; height: auto; }
.lbl-pos { font: 700 13px system-ui, sans-serif; fill: #17382b; font-variant-numeric: tabular-nums; }
.lbl-name { font: 700 15px system-ui, sans-serif; fill: #ffffff; paint-order: stroke; stroke: #17382b; stroke-width: 4px; stroke-linejoin: round; }
.lbl-rate { font: 600 13px system-ui, sans-serif; fill: #d9f2c4; paint-order: stroke; stroke: #17382b; stroke-width: 4px; stroke-linejoin: round; }
.lbl-dist { font: 600 12px system-ui, sans-serif; fill: #f4ecd2; opacity: .85; }
.base { fill: #ffffff; stroke: #17382b; stroke-width: 2; }
.tag { fill: var(--tag); stroke: #17382b; stroke-width: 1.5; }
.tag.low { fill: var(--tag-low); }
.runner { transition: transform var(--move, 700ms) ease-in-out, opacity 300ms; }
.runner rect { fill: var(--accent); stroke: var(--accent-edge); stroke-width: 2.5; }
.runner .lbl-rate { fill: #ffe9a3; }
.ball { fill: #ffffff; stroke: #1c1b18; stroke-width: 1.5; opacity: 0; }
.hud-banner { position: absolute; left: 50%; top: 17%; transform: translate(-50%, -50%) scale(.9); background: rgba(23,56,43,.94); color: var(--board-ink); border: 3px solid var(--accent); border-radius: 10px; padding: 12px 22px; text-align: center; opacity: 0; pointer-events: none; transition: opacity 180ms, transform 180ms; max-width: 86%; }
.hud-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.hud-banner .big { font-size: 30px; font-weight: 900; letter-spacing: .02em; }
.hud-banner .small { font-size: 16px; margin-top: 2px; }
.hud-park { position: absolute; left: 12px; top: 10px; color: #f4ecd2; font-size: 14px; font-weight: 600; text-shadow: 0 1px 2px #000; max-width: 45%; }
.hud-park small { display: block; font-weight: 400; opacity: .9; }

/* Calls */
.hud-controls { background: var(--panel); border: 1px solid var(--rule); border-top: 0; padding: 12px 16px; display: grid; grid-template-columns: auto 1fr 1fr; gap: 16px; align-items: start; }
.hud-controls form { margin: 0; }
.hud-group h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hud-group h3 b { color: var(--ink); }
.hud-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.hud-btn { display: inline-flex; align-items: center; justify-content: center; background: var(--btn); color: var(--btn-ink); border: 2px solid var(--ink); border-radius: 8px; padding: 10px 14px; font: 700 16px/1.2 system-ui, sans-serif; min-height: 48px; cursor: pointer; text-decoration: none; }
.hud-btn kbd { font: 600 12px ui-monospace, monospace; border: 1px solid var(--off); border-radius: 4px; padding: 0 5px; margin-left: 6px; color: var(--muted); }
.hud-btn:disabled, .hud-btn[aria-disabled="true"] { border-color: var(--off); color: var(--off); cursor: not-allowed; }
.hud-btn.live { border-color: #b98a00; box-shadow: inset 0 0 0 2px var(--accent); }
.hud-btn.play { flex-direction: column; background: var(--accent); color: var(--accent-ink); border-color: var(--accent-edge); font-size: 20px; padding: 12px 26px; min-height: 64px; min-width: 210px; }
.hud-btn.play:disabled { background: var(--rule); color: var(--muted); border-color: var(--off); }
.hud-btn.play small { display: block; font-size: 13px; font-weight: 600; }
.hud-btn.small { min-height: 44px; font-size: 15px; padding: 8px 12px; }
.hud-why { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
.hud-pace { margin-top: 8px; font-size: 14px; color: var(--muted); display: flex; gap: 10px; align-items: center; min-height: 44px; }

/* Recent plays */
.hud-recent { background: var(--panel); border: 1px solid var(--rule); border-top: 0; border-radius: 0 0 10px 10px; padding: 10px 16px; }
.hud-recent ol { margin: 4px 0 0; padding: 0; list-style: none; font-size: 15px; }
.hud-recent li { padding: 4px 0; border-top: 1px solid var(--rule); display: flex; gap: 10px; }
.hud-recent li:first-child { font-weight: 700; }
.hud-recent .when { color: var(--muted); min-width: 92px; white-space: nowrap; }

/* Below the HUD */
.hud-below { margin: 20px 0 0; }
.hud-below h1, .hud-below h2 { font-weight: 700; }
.hud-box { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 16px; margin: 0 0 16px; font-size: 14px; }
.hud-box h2 { font-size: 15px; margin: 0 0 6px; }
.hud-box select { background: var(--btn); color: var(--btn-ink); border: 1px solid var(--off); border-radius: 6px; padding: 6px 8px; min-height: 44px; }
.hud-seats { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 16px; font-size: 14px; }
.hud-seats > div { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 12px; display: flex; gap: 8px; align-items: center; }
.hud-seats button { text-decoration: underline; min-height: 44px; }
.hud-pbp { margin: 0; padding: 0; list-style: none; font-size: 14px; }
.hud-pbp li { padding: 4px 0; border-top: 1px solid var(--rule); }

/* Substitution panel */
.hud-drawer { position: fixed; inset: 0 0 0 auto; width: min(780px, 100%); background: var(--panel); color: var(--ink); border-left: 2px solid var(--ink); transform: translateX(102%); visibility: hidden; transition: transform 220ms ease, visibility 0s linear 220ms; z-index: 60; display: flex; flex-direction: column; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.hud-drawer:target, .hud-drawer.open { transform: none; visibility: visible; transition: transform 220ms ease; }
.hud-drawer > form { display: flex; flex-direction: column; flex: 1; min-height: 0; margin: 0; }
.hud-drawer[data-tab="def"] { overflow-y: auto; }
.hud-drawer[data-tab="def"] > form { flex: 0 0 auto; }
.hud-drawer-head { padding: 14px 18px 8px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: start; gap: 12px; background: var(--panel); }
.hud-drawer h2 { margin: 0; font-size: 20px; font-weight: 700; }
.hud-drawer .body { padding: 10px 18px; overflow: auto; flex: 1; }
.hud-tabs { display: flex; gap: 6px; padding: 8px 18px 0; flex-wrap: wrap; }
.hud-tab { border: 2px solid var(--rule); border-bottom: 0; color: var(--muted); border-radius: 8px 8px 0 0; padding: 10px 12px; font-weight: 700; text-decoration: none; min-height: 44px; }
.hud-tab.on { border-color: var(--ink); color: var(--ink); background: var(--page); }
.hud-pick { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
.hud-pick th { font-size: 12px; color: var(--muted); text-align: right; padding: 6px; position: sticky; top: 0; background: var(--panel); font-weight: 600; }
.hud-pick td { text-align: right; padding: 9px 6px; border-top: 1px solid var(--rule); }
.hud-pick th:nth-child(-n+3), .hud-pick td:nth-child(-n+3) { text-align: left; }
.hud-pick td.pickcell { width: 28px; }
.hud-pick input[type=radio] { width: 20px; height: 20px; accent-color: var(--accent-edge); }
.hud-pick tr.row { cursor: pointer; }
.hud-pick tr.row:hover td { background: rgba(242,194,48,.12); }
.hud-pick tr.row:has(input:checked) td { background: rgba(242,194,48,.28); font-weight: 700; }
.hud-pick tr.no td { color: var(--off); cursor: not-allowed; }
.hud-pick tr.no small { display: block; font-weight: 600; }
.hud-pick .name { font-weight: 700; }
.hud-pick .up { color: var(--good); font-weight: 700; }
.hud-pick .down { color: var(--bad); font-weight: 700; }
.hud-pick select { background: var(--btn); color: var(--btn-ink); border: 1px solid var(--off); border-radius: 6px; padding: 4px; min-height: 40px; }
.hud-choices { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
.hud-choices label { border: 2px solid var(--rule); border-radius: 8px; padding: 8px 12px; min-height: 44px; display: flex; gap: 8px; align-items: center; cursor: pointer; }
.hud-choices label:has(input:checked) { border-color: var(--ink); background: rgba(242,194,48,.18); }
.hud-section { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
.hud-compare { border-top: 2px solid var(--ink); padding: 12px 18px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; background: var(--page); }
.hud-compare p { margin: 0; font-size: 15px; }
.hud-compare .hud-btn.play { min-height: 48px; min-width: 0; font-size: 16px; padding: 10px 18px; }
.hud-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity 200ms; z-index: 55; display: block; }
.hud-page:has(.hud-drawer:target) .hud-scrim, .hud-page:has(.hud-drawer.open) .hud-scrim { opacity: 1; pointer-events: auto; }

@media (max-width: 980px) {
  .hud-board { grid-template-columns: 1fr; }
  .hud-situation { text-align: left; display: flex; gap: 16px; align-items: center; min-width: 0; }
  .hud-outs { margin: 0; }
  .hud-line td { font-size: 18px; min-width: 22px; }
  .hud-line td.team { font-size: 16px; min-width: 52px; }
  .hud-mid { grid-template-columns: 1fr 1fr; }
  .hud-field { grid-column: 1 / -1; order: -1; border: 0 !important; border-bottom: 1px solid var(--rule) !important; }
  .hud-field + .hud-card { border-left: 1px solid var(--rule); }
  .hud-card + .hud-field { border-left: 0; }
  .hud-controls { grid-template-columns: 1fr; }
  .hud-btn.play { width: 100%; }
}
@media (max-width: 620px) {
  .hud-mid { grid-template-columns: 1fr; }
  .hud-field + .hud-card { border-left: 0; border-top: 1px solid var(--rule); }
  .hud-card { border-top: 1px solid var(--rule); }
  .hud-line th, .hud-line td { font-size: 15px; }
  .hud-line .early { display: none; }
  .hud-pick .wide { display: none; }
  .hud-pick { font-size: 14px; }
  .hud-pick th, .hud-pick td { padding-left: 3px; padding-right: 3px; }
  .hud-park { font-size: 12px; }
  .hud-banner { top: 22%; padding: 8px 14px; }
  .hud-banner .big { font-size: 22px; }
  .hud-banner .small { font-size: 13px; }
  .hud-playdock { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 16px; background: var(--panel); border-top: 2px solid var(--ink); z-index: 50; }
  .hud-playdock .hud-pace, .hud-playdock .hud-why { display: none; }
  .hud-btn.play { min-height: 56px; }
  body { padding-bottom: 84px; }
}
@media (prefers-reduced-motion: reduce) { .runner, .hud-banner, .hud-drawer { transition: none; } .hud-line td.flash { animation: none; } }
</style>
