{# ABOUTME: Checking Rest (unlimited) on a playing-time row clears that row's number and stops it being submitted. #}
{# ABOUTME: The server is what decides the gap. This only keeps a blank number from looking required. #}
<script>
(function () {
  function bind(row) {
    var box = row.querySelector("[data-unlimited]");
    var amount = row.querySelector("[data-amount]");
    if (!box || !amount) return;
    function sync() {
      amount.disabled = box.checked;
      if (box.checked) amount.value = "";
    }
    box.addEventListener("change", sync);
    sync();
  }
  document.querySelectorAll("[data-depth-row]").forEach(bind);
})();
</script>
