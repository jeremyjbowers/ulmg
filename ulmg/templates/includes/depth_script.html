{# ABOUTME: Checking Unlimited on a depth-chart row clears the number and stops it being submitted. #}
{# ABOUTME: The server is what decides the gap. This only keeps a blank number from looking required. #}
<script>
(function () {
  function bind(form) {
    var box = form.querySelector("[data-unlimited]");
    var amount = form.querySelector("[data-amount]");
    if (!box || !amount) return;
    function sync() {
      amount.disabled = box.checked;
      if (box.checked) amount.value = "";
    }
    box.addEventListener("change", sync);
    sync();
  }
  document.querySelectorAll("[data-depth-form]").forEach(bind);
})();
</script>
