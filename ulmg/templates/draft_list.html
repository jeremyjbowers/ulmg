{% extends 'base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto">
  <h1 class="text-2xl font-bold mb-4">Drafts</h1>
  {% regroup drafts by year as draft_years %}
  {% for year in draft_years %}
  <h2 class="text-lg font-bold mt-6 mb-1">{{ year.grouper }}</h2>
  <div class="grid grid-cols-1 gap-2 text-sm">
    {% for d in year.list %}
    <a href="{{ d.url }}" class="underline py-2 border-b border-gray-200">{{ d.label }}</a>
    {% endfor %}
  </div>
  {% empty %}
  <div class="text-gray-500">No drafts available.</div>
  {% endfor %}
</div>
{% endblock %}
